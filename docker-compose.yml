services:
  casaboard:
    # Update: docker compose pull && docker compose up -d
    # Contributors building from source: docker compose build (uses `build: .`).
    image: ghcr.io/element-software/casaboard:latest
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
    restart: unless-stopped
