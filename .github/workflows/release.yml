name: Release

# Every push to main ships a new release (version from conventional commits).
# Manual override: Actions → Release → Run workflow (pick bump, or auto).
# Builds + pushes the multi-arch image FIRST, then bumps casaboard/config.yaml
# so Home Assistant never offers a version whose image doesn't exist yet.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = infer from conventional commits)"
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  release:
    # Skip the bot's own "Release vX.Y.Z" push so we don't recurse forever.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.actor != 'github-actions[bot]' &&
       !startsWith(github.event.head_commit.message, 'Release v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute version
        id: v
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version: *"\{0,1\}\([0-9.]*\)"\{0,1\}$/\1/p' casaboard/config.yaml)
          IFS=. read -r major minor patch <<<"$current"

          bump="${INPUT_BUMP:-auto}"
          if [ "$bump" = "auto" ] || [ -z "$bump" ]; then
            prev=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)
            range="${prev:+$prev..}HEAD"
            subjects=$(git log --format='%s' $range)
            bodies=$(git log --format='%b' $range)
            if echo "$subjects" | grep -qE '^[a-z]+(\([^)]+\))?!:' \
              || echo "$bodies" | grep -qE '^BREAKING CHANGE:'; then
              bump=major
            elif echo "$subjects" | grep -qE '^feat(\([^)]+\))?:'; then
              bump=minor
            else
              bump=patch
            fi
          fi

          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
            *) echo "Unknown bump: $bump" >&2; exit 1 ;;
          esac
          echo "current=$current bump=$bump next=$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/casaboard-ha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CASABOARD_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump version, changelog, tag, release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)
          notes=$(git log --no-merges --format='- %s' ${prev:+$prev..}HEAD -- . ':!docs' ':!casaboard/CHANGELOG.md')
          [ -n "$notes" ] || notes="- Maintenance release"

          sed -i "s/^version: .*/version: \"$VERSION\"/" casaboard/config.yaml
          { sed -n '1,4p' casaboard/CHANGELOG.md
            printf '## [%s] - %s\n\n%s\n\n' "$VERSION" "$(date -u +%F)" "$notes"
            sed '1,4d' casaboard/CHANGELOG.md; } > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md casaboard/CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" --title "CasaBoard v$VERSION" --notes "$notes"
